name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Ověř, že commity od posledního tagu dodržují Conventional Commits
        run: npx commitlint --from "$(git describe --tags --abbrev=0 2>/dev/null || echo HEAD~20)" --to HEAD

      - run: npm run typecheck
      - run: npm run smoke
      - run: npm run build

      - name: Sémantické verzování a GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
